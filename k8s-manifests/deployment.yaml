apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker-deployment
  labels:
    app: task-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-tracker
  template:
    metadata:
      labels:
        app: task-tracker
    spec:
      containers:
      - name: task-tracker-api
        image: task-tracker-api:latest
        imagePullPolicy: Never # Forces the cluster to use the local image
        ports:
        - containerPort: 8000